<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Joule Coach: two dimension lines comparing a reference height against a measured one"
     style="color:#121416">
  <title>Joule Coach - The Measure</title>
  <!-- reference depth -->
  <line x1="34" y1="22" x2="34" y2="74" stroke="currentColor" stroke-width="4.5"/>
  <line x1="25" y1="22" x2="43" y2="22" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="25" y1="74" x2="43" y2="74" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  <!-- what the set actually reached -->
  <line x1="63" y1="40" x2="63" y2="74" stroke="#E85D0C" stroke-width="4.5"/>
  <line x1="54" y1="40" x2="72" y2="40" stroke="#E85D0C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="54" y1="74" x2="72" y2="74" stroke="#E85D0C" stroke-width="4.5" stroke-linecap="round"/>
</svg>
