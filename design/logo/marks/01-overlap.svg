<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Joule Coach: two camera frames overlapping, the shared volume filled"
     style="color:#121416">
  <title>Joule Coach - The Overlap</title>
  <!-- the measured volume: only where two views agree -->
  <rect x="34" y="30" width="28" height="36" fill="#E85D0C"/>
  <rect x="14" y="18" width="48" height="48" fill="none" stroke="currentColor" stroke-width="4"/>
  <rect x="34" y="30" width="48" height="48" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>
