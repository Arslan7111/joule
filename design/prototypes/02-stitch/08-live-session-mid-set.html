<style>body {

    position: absolute;

    z-index: 0;

    background-size: cover;
    background-position: center;
    filter: brightness(0.6) contrast(1.1)
    }
/* Safe area handling */
.pb-safe {
    padding-bottom: env(safe-area-inset-bottom, 24px)
    }
.pt-safe {
    padding-top: env(safe-area-inset-top, 24px)
    }
/* Pulse Animation for warning */
@keyframes subtle-pulse {
    0% {
        opacity: 0.9;
        } 50% {
        opacity: 1;
        } 100% {
        opacity: 0.9;
        }
    }

<body class="relative h-screen w-full flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Simulated Live Camera Background -->
<div class="camera-feed" data-alt="A low-angle, high-contrast black and white photograph of an athlete performing a heavy back squat in a gritty, industrial gym setting. The lighting is dramatic and directional, highlighting the musculature and creating deep shadows. Technical, biomechanical tracking overlays in glowing orange and sharp cyan dot the athlete's joints, emphasizing a data-driven, high-precision aesthetic. The scene feels intense, focused, and professional."></div>
<!-- HUD Overlay - Safe Area Model -->
<div class="relative z-10 flex flex-col h-full w-full pointer-events-none">
<!-- Top Telemetry & Controls -->
<div class="flex justify-between items-start pt-safe px-container-padding mt-stack-md w-full">
<!-- Session Info -->
<div class="flex flex-col gap-unit pointer-events-auto">
<div class="bg-surface/60 backdrop-blur-sm border border-surface-variant rounded flex items-center px-3 py-1.5 w-fit">
<span class="w-2 h-2 rounded-full bg-error mr-2 animate-pulse"></span>
<span class="font-data-label text-data-label text-on-surface">REC</span>
<span class="font-data-label text-data-label text-on-surface-variant ml-3">01:42</span>
</div>
</div>
<!-- Controls -->
<div class="pointer-events-auto">
<button class="w-12 h-12 bg-surface/60 backdrop-blur-sm border border-surface-variant rounded flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</div>
<!-- Center Canvas - Core Metric -->
<div class="flex-1 flex flex-col items-center justify-center pointer-events-none mt-[-10vh]">
<div class="flex flex-col items-center">
<!-- Current Exercise Label -->
<div class="bg-surface/80 backdrop-blur-md border border-surface-variant rounded px-4 py-2 mb-stack-sm pointer-events-auto">
<span class="font-data-label text-data-label text-on-surface tracking-widest uppercase">Back Squat</span>
</div>
<!-- Massive Rep Counter -->
<div class="font-display-metrics text-display-metrics text-on-surface drop-shadow-2xl">
                    08
                </div>
<div class="font-data-label text-data-label text-on-surface-variant mt-unit">
                    REPS COMPLETED
                </div>
</div>
</div>
<!-- Bottom Alert Banner -->
<div class="w-full px-container-padding pb-safe mb-stack-lg pointer-events-auto flex flex-col items-center">

<div class="bg-surface/60 backdrop-blur-sm border border-surface-variant rounded px-3 py-2 flex flex-col items-center w-24">

</div>
<div class="flex items-center gap-2 bg-on-primary-container/10 px-3 py-1.5 rounded">
