<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post-Set Report - Joule Coach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#7e2c00",
                    "on-surface-variant": "#e3bfb1",
                    "error-container": "#93000a",
                    "surface-container-high": "#2a2a2a",
                    "on-tertiary-fixed": "#001c38",
                    "primary-fixed-dim": "#ffb598",
                    "surface": "#131313",
                    "on-primary-fixed": "#360f00",
                    "tertiary-container": "#0f93fe",
                    "surface-dim": "#131313",
                    "inverse-surface": "#e5e2e1",
                    "surface-container-low": "#1c1b1b",
                    "on-background": "#e5e2e1",
                    "on-secondary-fixed-variant": "#005228",
                    "tertiary": "#a3c9ff",
                    "on-tertiary": "#00315c",
                    "on-primary": "#591d00",
                    "on-surface": "#e5e2e1",
                    "surface-variant": "#353534",
                    "on-primary-container": "#4e1800",
                    "primary": "#ffb598",
                    "secondary-container": "#06bb63",
                    "tertiary-fixed-dim": "#a3c9ff",
                    "inverse-on-surface": "#313030",
                    "outline": "#aa8a7e",
                    "tertiary-fixed": "#d3e4ff",
                    "surface-tint": "#ffb598",
                    "surface-container-highest": "#353534",
                    "background": "#131313",
                    "on-secondary-container": "#00431f",
                    "on-tertiary-fixed-variant": "#004882",
                    "on-secondary-fixed": "#00210c",
                    "primary-fixed": "#ffdbce",
                    "error": "#ffb4ab",
                    "outline-variant": "#5a4137",
                    "surface-bright": "#393939",
                    "primary-container": "#f75f05",
                    "secondary": "#4ae183",
                    "inverse-primary": "#a53c00",
                    "surface-container-lowest": "#0e0e0e",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#6bfe9c",
                    "on-error": "#690005",
                    "on-secondary": "#003919",
                    "secondary-fixed-dim": "#4ae183",
                    "surface-container": "#201f1f",
                    "on-tertiary-container": "#002a50"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "stack-lg": "32px",
                    "gutter": "12px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "container-padding": "24px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "display-metrics": ["Hanken Grotesk"],
                    "data-label": ["JetBrains Mono"],
                    "data-value": ["JetBrains Mono"],
                    "body-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "display-metrics": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "data-label": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                    "data-value": ["20px", { "lineHeight": "20px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
            }
          }
        }
      }
    </script>
<style>
        /* Instrument-like grid background */
        .tech-grid {
            background-size: 24px 24px;
            background-image: 
                linear-gradient(to right, rgba(90, 65, 55, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(90, 65, 55, 0.1) 1px, transparent 1px);
        }
        /* Joint rendering */
        .joint {
            fill: #131313;
            stroke-width: 2px;
        }
        .bone {
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* Scanner animation */
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400%); }
        }
        .scanner-line {
            animation: scan 4s linear infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-surface">
<!-- TopAppBar Shared Component -->
<!-- Suppressed BottomNavBar due to Task-Focused/Linear post-set report nature -->
<header class="w-full top-0 sticky border-b border-outline-variant dark:border-outline-variant bg-surface dark:bg-surface flex justify-between items-center px-container-padding h-16 z-50 flat no shadows">
<button class="text-primary dark:text-primary hover:bg-surface-container-high transition-colors active:opacity-80 p-2 -ml-2 rounded-DEFAULT flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sensors</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">JOULE COACH</h1>
<button class="text-primary dark:text-primary hover:bg-surface-container-high transition-colors active:opacity-80 p-2 -mr-2 rounded-DEFAULT flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">videocam</span>
</button>
</header>
<main class="flex-1 flex flex-col px-container-padding py-stack-md gap-stack-md max-w-2xl mx-auto w-full">
<!-- Post-Set Meta Chip -->
<div class="flex justify-between items-center">
<div class="bg-surface-variant text-on-surface font-data-label text-data-label px-2 py-1 rounded-DEFAULT uppercase tracking-wider inline-flex items-center gap-2 border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
                SET 04 COMPLETE
            </div>
<div class="font-data-label text-data-label text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span> 01:24
            </div>
</div>
<!-- Hero Visualization: Skeleton Overlay -->
<div class="relative w-full aspect-square md:aspect-video bg-surface-container-low border border-outline-variant rounded-DEFAULT overflow-hidden flex items-center justify-center tech-grid group">
<!-- Ambient Telemetry Overlay -->
<div class="absolute top-2 left-2 flex flex-col gap-1">
<span class="font-data-label text-data-label text-on-surface-variant opacity-70">POS_TRK: ACTV</span>
<span class="font-data-label text-[10px] text-on-surface-variant opacity-50">FPS: 59.94</span>
</div>
<!-- SVG Skeleton Canvas -->
<svg class="w-[80%] h-[80%] overflow-visible" viewbox="0 0 100 100">
<!-- Ghost Reference Skeleton (Ideal Form) -->
<g class="opacity-20 stroke-on-surface-variant bone" stroke-width="1.5">
<line x1="50" x2="50" y1="20" y2="45"></line> <!-- Spine -->
<line x1="40" x2="60" y1="25" y2="25"></line> <!-- Shoulders -->
<line x1="40" x2="35" y1="25" y2="40"></line> <!-- L Arm -->
<line x1="60" x2="65" y1="25" y2="40"></line> <!-- R Arm -->
<line x1="45" x2="55" y1="45" y2="45"></line> <!-- Hips -->
<line x1="45" x2="40" y1="45" y2="70"></line> <!-- L Thigh -->
<line x1="55" x2="60" y1="45" y2="70"></line> <!-- R Thigh -->
<line x1="40" x2="45" y1="70" y2="95"></line> <!-- L Calf -->
<line x1="60" x2="55" y1="70" y2="95"></line> <!-- R Calf -->
</g>
<!-- Active Tracking Skeleton (Deviation on reps 5-6) -->
<g class="stroke-inverse-surface bone" stroke-width="2">
<!-- Upper Body (Stable) -->
<line x1="50" x2="50" y1="20" y2="45"></line>
<line x1="40" x2="60" y1="25" y2="25"></line>
<line x1="40" x2="35" y1="25" y2="40"></line>
<line x1="60" x2="65" y1="25" y2="40"></line>
<line x1="45" x2="55" y1="45" y2="45"></line>
<!-- Right Leg (Stable) -->
<line x1="55" x2="60" y1="45" y2="70"></line>
<line x1="60" x2="55" y1="70" y2="95"></line>
<!-- Left Leg (Deviation - Tracking Inward) -->
<line class="stroke-primary-container" x1="45" x2="48" y1="45" y2="72"></line> <!-- Femur angled in -->
<line class="stroke-primary-container" x1="48" x2="45" y1="72" y2="95"></line> <!-- Tibia angled out to foot -->
<!-- Joints -->
<circle class="joint stroke-inverse-surface" cx="50" cy="20" r="3"></circle> <!-- Head -->
<circle class="joint stroke-inverse-surface" cx="45" cy="45" r="2"></circle> <!-- L Hip -->
<circle class="joint stroke-inverse-surface" cx="55" cy="45" r="2"></circle> <!-- R Hip -->
<circle class="joint stroke-inverse-surface" cx="60" cy="70" r="2"></circle> <!-- R Knee -->
<!-- Problem Joint Highlight -->
<circle class="joint stroke-primary-container" cx="48" cy="72" r="2.5"></circle> <!-- L Knee -->
<!-- Angle Callout Arc -->
<path d="M 45 68 A 12 12 0 0 0 51 68" fill="none" stroke="#f75f05" stroke-dasharray="2 2" stroke-width="1"></path>
</g>
</svg>
<!-- Diagnostic Overlay Banner -->
<div class="absolute bottom-4 inset-x-4 bg-surface-container-high/90 backdrop-blur-sm border border-primary-container/50 p-3 rounded-DEFAULT flex items-start gap-3">
<span class="material-symbols-outlined text-primary-container mt-0.5" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="flex flex-col gap-1">
<span class="font-data-label text-data-label text-primary-container uppercase">Kinematic Deviation</span>
<p class="font-body-md text-on-surface-variant text-sm">Left knee tracking inward on reps 5–6.</p>
</div>
</div>
<!-- Simulated Scanner Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/20 shadow-[0_0_10px_rgba(255,181,152,0.3)] scanner-line"></div>
</div>
<!-- Rep Sequence Strip -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-data-label text-data-label text-on-surface-variant uppercase">Rep Sequence (08)</span>
<span class="font-data-label text-[12px] text-outline">L-&gt;R</span>
</div>
<!-- Segmented Bars for sets -->
<div class="flex gap-1 h-8 w-full">
<!-- Reps 1-4: Solid Green (Good) -->
<div class="flex-1 bg-secondary rounded-l-[1px] border border-secondary transition-opacity hover:opacity-80"></div>
<div class="flex-1 bg-secondary border border-secondary transition-opacity hover:opacity-80"></div>
<div class="flex-1 bg-secondary border border-secondary transition-opacity hover:opacity-80"></div>
<div class="flex-1 bg-secondary border border-secondary transition-opacity hover:opacity-80"></div>
<!-- Rep 5: Warning (Dashed Yellow/Primary) -->
<div class="flex-1 border border-primary border-dashed bg-primary/20 relative group">
<!-- Warning indicator dot -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-1 h-1 bg-primary rounded-full"></div>
</div>
<!-- Rep 6: Warning -->
<div class="flex-1 border border-primary border-dashed bg-primary/20 relative">
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-1 h-1 bg-primary rounded-full"></div>
</div>
<!-- Rep 7: Error (Red/Error) -->
<div class="flex-1 bg-error border border-error transition-opacity hover:opacity-80"></div>
<!-- Rep 8: Error -->
<div class="flex-1 bg-error rounded-r-[1px] border border-error transition-opacity hover:opacity-80"></div>
</div>
</div>
<!-- Summary & CTA Section -->
<div class="border border-outline-variant bg-surface p-stack-md flex flex-col gap-stack-lg rounded-DEFAULT mt-2">
<div class="flex flex-col gap-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Analysis Summary</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant border-l-2 border-outline pl-3 py-1">
                    Strong initial sets; watch depth and unilateral stability on late reps.
                </p>
</div>
<button class="w-full bg-primary-container text-surface font-headline-md font-bold uppercase tracking-wider py-4 px-6 rounded-DEFAULT flex items-center justify-center gap-3 transition-colors hover:bg-[#ff7a2b] active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                Watch 40s Fix-it Demo
            </button>
</div>
</main>
</body></html>
