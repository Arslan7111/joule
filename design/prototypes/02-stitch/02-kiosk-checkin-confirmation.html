<style>
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        .blinking-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen font-body-md relative overflow-hidden flex flex-col justify-center items-center p-container-padding">
<div class="scanline"></div>
<!-- Header / Brand (Minimal) -->
<header class="absolute top-0 w-full flex justify-between items-center px-container-padding h-16 border-b border-outline-variant bg-surface z-20">
<div class="flex items-center gap-gutter">
<span class="material-symbols-outlined text-primary" data-icon="sensors" style="font-variation-settings: 'FILL' 1;">sensors</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">JOULE COACH</span>
</div>
<div class="flex items-center gap-stack-sm text-on-surface-variant">
<span class="font-data-label text-data-label uppercase">SYS_ONLINE</span>
<span class="material-symbols-outlined text-[16px]" data-icon="videocam" style="font-variation-settings: 'FILL' 1;">videocam</span>
</div>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-2xl mt-16 z-20 flex flex-col gap-stack-lg relative">
<!-- Status Header -->
<div class="flex flex-col items-center justify-center text-center gap-stack-sm mb-stack-md">
<div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center mb-unit">
<span class="material-symbols-outlined text-[32px] text-secondary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-display-metrics text-display-metrics text-on-surface uppercase tracking-tight">CHECKED IN</h1>
<p class="font-data-value text-data-value text-on-surface-variant uppercase mt-unit">08:42:15 AM PST</p>
</div>
<!-- Bento Grid Details -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-unit">
<!-- Station Card -->
<div class="bg-surface-container border border-outline-variant p-stack-md flex flex-col gap-stack-sm">
<span class="font-data-label text-data-label text-on-surface-variant uppercase">Assigned Station</span>
<div class="flex items-end justify-between mt-auto">
<span class="font-headline-lg text-headline-lg text-on-surface uppercase">SQUAT RACK 4</span>
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="fitness_center">fitness_center</span>
</div>
</div>
<!-- Sync Status Card -->
<div class="bg-surface-container border border-outline-variant p-stack-md flex flex-col gap-stack-sm relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 opacity-50"></div>
<span class="font-data-label text-data-label text-on-surface-variant uppercase relative z-10">Telemetry Sync</span>
<div class="flex flex-col gap-unit mt-auto relative z-10">
<div class="flex justify-between items-center">
<span class="font-data-value text-data-value text-primary blinking-cursor">Syncing with Camera 08/12...</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-[2px] bg-surface-variant mt-unit flex gap-[1px]">
<div class="h-full w-1/4 bg-primary"></div>
<div class="h-full w-1/4 bg-primary"></div>
<div class="h-full w-1/4 bg-primary"></div>
<div class="h-full w-1/4 bg-primary animate-pulse"></div>
</div>
</div>
</div>
<!-- Mini Map / Directional -->
<div class="bg-surface-container border border-outline-variant p-stack-md md:col-span-2 flex flex-col gap-stack-md">
<div class="flex justify-between items-center">
<span class="font-data-label text-data-label text-on-surface-variant uppercase">Location</span>
<span class="bg-[#333333] text-on-surface font-data-label text-[12px] px-2 py-1 rounded-sm uppercase tracking-widest border border-outline-variant">ZONE B</span>
</div>
<div class="relative w-full h-32 border border-outline-variant bg-surface-dim overflow-hidden flex items-center justify-center">
<!-- Abstract Map Representation -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#5a4137 1px, transparent 1px); background-size: 16px 16px;"></div>
<div class="flex items-center gap-stack-lg z-10">
<div class="flex flex-col items-center gap-unit">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="kiosk">qr_code</span>
<span class="font-data-label text-[10px] text-on-surface-variant">KIOSK</span>
</div>
<!-- Directional Line -->
<div class="w-24 h-[2px] bg-outline-variant relative flex items-center">
<div class="absolute right-0 w-2 h-2 border-t-2 border-r-2 border-primary transform rotate-45 -translate-y-[1px]"></div>
</div>
<div class="flex flex-col items-center gap-unit relative">
<div class="absolute -inset-2 bg-primary/20 rounded-full animate-ping"></div>
<span class="material-symbols-outlined text-primary z-10" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-data-label text-[10px] text-primary font-bold">RACK 4</span>
</div>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="flex justify-center mt-stack-md">
<button class="bg-primary-container text-on-surface font-headline-lg text-[16px] uppercase px-stack-lg py-stack-sm tracking-widest hover:bg-primary transition-colors flex items-center gap-unit rounded-sm">
<span>PROCEED TO STATION</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple script to simulate progress bar loading
        setTimeout(() => {
            const cursorText = document.querySelector('.blinking-cursor');
            if (cursorText) {
                cursorText.textContent = 'Sync Complete. Cameras Active.';
                cursorText.classList.remove('blinking-cursor');
                cursorText.classList.add('text-secondary');
                cursorText.classList.remove('text-primary');
            }
            const pulseBar = document.querySelector('.animate-pulse');
            if(pulseBar) {
                pulseBar.classList.remove('animate-pulse');
            }
        }, 3500);
    </script>
</body></html>
